name: Keep Alive Bot

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server (Render)
        env:
          RENDER_PING_URL: ${{ vars.RENDER_PING_URL }}
        run: |
          if [ -z "$RENDER_PING_URL" ]; then
            echo "RENDER_PING_URL no configurada (Settings > Secrets and variables > Actions > Variables). Skip."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_PING_URL/ping")
          if [ "$STATUS" -ne 200 ]; then
            echo "Server returned status $STATUS"
            exit 1
          fi
          echo "Server OK (status $STATUS)"
