name: Keep Alive Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://franklinzg.pythonanywhere.com/ping)
          if [ "$STATUS" -ne 200 ]; then
            echo "Server returned status $STATUS"
            exit 1
          fi
          echo "Server OK (status $STATUS)"
